name: アプリケーション検査

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 対象ソースを取得
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Go の整形・静的検査・ユニットテスト
        run: bash scripts/check-go.sh unit
  go-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 対象ソースを取得
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: 結合テストを含む race 検査
        run: bash scripts/check-go.sh integration
  production-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 対象ソースを取得
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Python を準備
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: 本番用イメージのビルド・HTTP・設定・終了処理
        run: python3 scripts/check_image.py
