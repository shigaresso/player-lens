name: 配置用イメージ公開

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-production-image
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - name: main の対象ソースを取得
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Python を準備
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: GHCR へログイン
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: main CI の確認と一度のビルドと同じイメージの検証と送信
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/deploy.py publish
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          --receipt "$RUNNER_TEMP/publication.json"
      - name: digest 固定の Render 設定を生成
        env:
          PUBLIC_URL: ${{ vars.MCP_PUBLIC_URL }}
          REGISTRY_CREDENTIAL: ${{ vars.RENDER_REGISTRY_CREDENTIAL }}
        run: >-
          python3 scripts/deploy.py blueprint --repo "$GITHUB_REPOSITORY"
          --receipt "$RUNNER_TEMP/publication.json" --output "$RUNNER_TEMP/render.generated.yaml"
          --public-url "$PUBLIC_URL" --credential "$REGISTRY_CREDENTIAL"
      - name: 対象と Render 設定を記録
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP'])
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as output:
              output.write('検証済みイメージと生成した Render 設定。実配置は手動で行う。\n\n')
              for name, language in [('publication.json', 'json'), ('render.generated.yaml', 'yaml')]:
                  output.write(f'```{language}\n'+(directory/name).read_text(encoding='utf-8')+'```\n\n')
          PY
      - name: registry の認証を破棄
        if: always()
        run: docker logout ghcr.io
