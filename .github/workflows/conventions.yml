name: 規約検査

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: conventions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 対象ソースを取得
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Python を準備
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: 固定版の検査ツールを準備
        run: bash scripts/install-tools.sh
      - name: 共通検査
        run: bash scripts/check.sh
      - name: 隔離したリポジトリでフックを検証
        run: python3 scripts/verify_hooks.py
      - name: main の更新コミットを確認
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.after }}
        run: python3 scripts/validate.py main-range "$BASE_SHA" "$HEAD_SHA" --repo "$GITHUB_REPOSITORY"
