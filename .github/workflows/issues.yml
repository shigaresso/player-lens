name: Issue 規約検査

on:
  issues:
    types: [opened, edited, reopened, labeled, unlabeled]

permissions:
  contents: read
  issues: read

concurrency:
  group: issue-conventions-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  verify-issue:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: default branch の検査を取得
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Python を準備
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Issue の現在の本文とラベルを確認
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/validate.py github "$GITHUB_EVENT_PATH"
