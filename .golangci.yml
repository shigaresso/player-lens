version: "2"

run:
  go: "1.27.1"
  timeout: 5m
  tests: true
  build-tags: [integration]
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - errcheck
    - ineffassign
    - staticcheck
    - unused
    - wsl_v5
  settings:
    errcheck:
      check-blank: true
    wsl_v5:
      default: none
      enable:
        - err
        - after-block
        - after-defer

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
