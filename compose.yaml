services:
  app:
    build:
      context: .
      target: development
    environment:
      PORT: ${PORT:-8080}
      MCP_REQUESTS_PER_MINUTE: ${MCP_REQUESTS_PER_MINUTE:-6}
      MCP_REQUESTS_PER_DAY: ${MCP_REQUESTS_PER_DAY:-100}
      MCP_MAX_CONCURRENT: ${MCP_MAX_CONCURRENT:-2}
    ports:
      - "127.0.0.1:${DEV_PORT:-8080}:${PORT:-8080}"
    volumes:
      - go-build:/go-cache
      - go-mod:/go/pkg/mod
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:$${PORT}/healthz > /dev/null"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 30s
    develop:
      watch:
        - action: sync+restart
          path: ./cmd
          target: /src/cmd
        - action: rebuild
          path: ./go.mod
        - action: rebuild
          path: ./go.sum
        - action: sync+restart
          path: ./internal
          target: /src/internal
  collect:
    profiles: [tools]
    build:
      context: .
      target: development
    volumes:
      - .:/src:ro
      - go-build:/go-cache
      - go-mod:/go/pkg/mod
    entrypoint: ["sh", "-c", "go build -o /tmp/collect-reviews ./cmd/collect-reviews && exec /tmp/collect-reviews \"$@\"", "collect-reviews"]
    command: ["--help"]

  verify:
    profiles: [tools]
    build:
      context: .
      target: development
    volumes:
      - .:/src:ro
      - go-build:/go-cache
      - go-mod:/go/pkg/mod
    command: ["go", "test", "-count=1", "./..."]

  format:
    profiles: [tools]
    build:
      context: .
      target: development
    volumes:
      - .:/src:rw
    command: ["bash", "scripts/go-check.sh", "format-fix"]

  lint:
    profiles: [tools]
    build:
      context: .
      target: lint
    environment:
      GOLANGCI_LINT_CACHE: /lint-cache
    volumes:
      - .:/src:ro
      - go-build:/go-cache
      - go-mod:/go/pkg/mod
      - go-lint:/lint-cache
    command: ["golangci-lint", "run", "--config", ".golangci.yml", "./..."]

volumes:
  go-build:
  go-mod:
  go-lint:
